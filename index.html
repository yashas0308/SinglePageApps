<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Single Page Apps</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 2rem;
        }
        .container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .app-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 250px;
            transition: transform 0.2s;
        }
        .app-card:hover {
            transform: translateY(-5px);
        }
        .app-card h2 {
            margin-top: 0;
            color: #444;
        }
        .app-card p {
            color: #666;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>My Single Page Applications</h1>
    <div class="container">
        <div class="app-card">
            <h2>Gold Price App</h2>
            <p>Check the latest gold prices with a sleek UI.</p>
            <a href="./gold-price-app/" class="btn">Launch App</a>
        </div>
        <div class="app-card">
            <h2>Modern Form UI</h2>
            <p>A responsive form example with modern styling.</p>
            <a href="./modern-form-ui/" class="btn">Launch App</a>
        </div>
    </div>
</body>
</html>
